name: LITTOS social publish

on:
  schedule:
    # 22:00 UTC ~= 18:00 America/New_York during EDT (summer). During EST
    # (winter) this fires at 17:00 local instead - a known +/-1h DST drift
    # documented in automation/README.md. Adjust here if the owner's
    # timezone differs from America/New_York (also update TIMEZONE below).
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install pipeline package
        run: pip install -e ./automation

      - name: Publish today's due posts
        id: publish
        continue-on-error: true
        env:
          SITE_BASE_URL: https://futureimperfect.band
          TIMEZONE: America/New_York
          END_CARD_TRIM_SECONDS: "10.0"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: littos-poster publish-due --date today

      # Runs even if the publish step above failed, so a partial success
      # (e.g. IG went out but TikTok errored) is not lost on retry - the
      # log is what stops the next run from double-posting to IG.
      - name: Persist publish log
        if: always()
        run: |
          git config user.name "littos-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/state/publish_log.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update publish log [skip ci]"
            git push
          fi

      - name: Fail the run if publishing failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "publish-due reported a failure - see the step above and the run summary." >&2
          exit 1
