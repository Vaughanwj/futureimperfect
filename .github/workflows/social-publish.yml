name: LITTOS social publish

on:
  schedule:
    # 22:00 UTC ~= 18:00 America/New_York during EDT (summer). During EST
    # (winter) this fires at 17:00 local instead - a known +/-1h DST drift
    # documented in automation/README.md. Adjust here if the owner's
    # timezone differs from America/New_York (also update TIMEZONE below).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to publish for (YYYY-MM-DD), or 'today' for a normal run. Use a past date to backfill a missed/failed day."
        required: false
        default: "today"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install pipeline package
        run: pip install -e ./automation

      # Instagram + Facebook - TikTok is handled natively via TikTok
      # Studio's own scheduler, outside this pipeline (see
      # automation/README.md and ACTIVE_PLATFORMS in adapters/driving/cli.py).
      - name: Publish due posts
        id: publish
        continue-on-error: true
        env:
          SITE_BASE_URL: https://futureimperfect.band
          TIMEZONE: America/New_York
          END_CARD_TRIM_SECONDS: "10.0"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: littos-poster publish-due --date "${{ github.event.inputs.date || 'today' }}"

      # Runs even if the publish step above failed, so a partial success
      # is not lost on retry - the log is what stops the next run from
      # double-posting to a platform that already succeeded.
      #
      # Retries with rebase on a push rejection: two runs whose date
      # ranges don't overlap (e.g. two manual backfills fired close
      # together) each add different, non-overlapping lines to the sorted
      # JSON array, so a rebase resolves cleanly without manual help. This
      # is belt-and-suspenders for a scenario that's already rare (only
      # concurrent workflow_dispatch runs can race here - the daily cron
      # never overlaps itself) - do not rely on it as a reason to fire
      # multiple backfills at once; prefer doing them one at a time.
      - name: Persist publish log
        if: always()
        run: |
          git config user.name "littos-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/state/publish_log.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update publish log [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5), rebasing onto origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase hit a real conflict - needs manual reconciliation, see automation/state/publish_log.json" >&2
              git rebase --abort
              exit 1
            fi
          done
          echo "failed to push publish log after 5 attempts" >&2
          exit 1

      - name: Fail the run if publishing failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "publish-due reported a failure - see the step above and the run summary." >&2
          exit 1
