name: TEMP diagnose IG account

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Account identity + recent media permalinks
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "== account =="
          curl -sG "https://graph.facebook.com/v21.0/$IG_USER_ID" \
            --data-urlencode "fields=username,name,media_count" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN"
          echo ""
          echo "== recent media =="
          curl -sG "https://graph.facebook.com/v21.0/$IG_USER_ID/media" \
            --data-urlencode "fields=id,permalink,media_product_type,media_type,timestamp,caption" \
            --data-urlencode "limit=10" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN"
