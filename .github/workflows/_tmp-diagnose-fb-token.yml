name: TEMP diagnose FB token expiry

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          curl -sG "https://graph.facebook.com/v21.0/debug_token" \
            --data-urlencode "input_token=$FB_PAGE_ACCESS_TOKEN" \
            --data-urlencode "access_token=$META_APP_ID|$META_APP_SECRET"
