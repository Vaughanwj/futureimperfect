name: TEMP diagnose FB video

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Video status + permalink
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          curl -sG "https://graph.facebook.com/v21.0/916206258215736" \
            --data-urlencode "fields=permalink_url,status,description" \
            --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN"
