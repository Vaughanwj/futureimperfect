name: Refresh IG access token

on:
  schedule:
    # Weekly, well inside the ~60-day expiry window - never let the token
    # get close to running out.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline package
        run: pip install -e ./automation

      - name: Exchange for a fresh long-lived token
        id: refresh
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          NEW_TOKEN=$(littos-poster refresh-ig-token)
          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      # gh secret set needs a token with permission to manage repo secrets,
      # which the default GITHUB_TOKEN does not have - hence GH_PAT, a
      # personal access token (repo scope) stored as its own secret. If
      # you'd rather not maintain that PAT, delete this workflow and just
      # refresh manually every ~60 days per automation/README.md.
      - name: Update IG_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "${{ steps.refresh.outputs.new_token }}"
