[project]
name = "littos-poster"
version = "0.1.0"
description = "Hexagonal social auto-poster: drips short-form clips to Instagram Reels (full auto). TikTok is handled natively via TikTok Studio."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
littos-poster = "littos_poster.adapters.driving.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
